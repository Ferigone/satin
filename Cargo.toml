[workspace]
members = ["crates/engine", "crates/browser", "crates/launcher", "crates/javascript", "crates/js-harness"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.30"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

