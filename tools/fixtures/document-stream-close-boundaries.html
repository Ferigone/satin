<!doctype html>
<meta charset="utf-8">
<title>Waiting for document stream boundary control</title>
<script>
var trace = [];
var nested = location.search === '?nested';
function closeBoundary() {
    trace.push('open:' + typeof document.open);
    document.title = trace.join('|');
    document.open();
    document.write('<!doctype html><title>Replacement</title>');
    document.addEventListener('readystatechange', function () {
        trace.push('ready:' + document.readyState);
    });
    document.addEventListener('DOMContentLoaded', function () {
        trace.push('dcl:' + document.readyState);
    });
    window.addEventListener('load', function (event) {
        trace.push('load:' + document.readyState + ':' + (event.target === document));
        setTimeout(function () { document.title = trace.join('|'); }, 0);
    });
    if (nested) {
        var inline = [
            'trace.push("nested-start:" + document.readyState);',
            'document.open();',
            'trace.push("same-script:" + (document.currentScript.id === "nested"));',
            'document.close();',
            'trace.push("nested-close:" + document.readyState);',
            'document.write("<b id=from-nested>Nested write</b>");',
            'trace.push("nested-end");'
        ].join('\n');
        document.write('<script id="nested">' + inline + '</scr' + 'ipt><p id=tail>Tail</p>');
        trace.push('write-return:' + document.readyState);
    } else {
        var source = location.search === '?held-defer' ? './held.js' :
            'data:text/javascript,' + encodeURIComponent("trace.push('deferred:' + document.readyState);");
        document.write('<script defer src="' + source + '"></scr' + 'ipt><p id=tail>Tail</p>');
    }
    document.close();
    trace.push('close-return:' + document.readyState);
    document.close();
    trace.push('again:' + document.readyState);
}
window.addEventListener('load', function () {
    setTimeout(closeBoundary, 0);
}, {once: true});
</script>
