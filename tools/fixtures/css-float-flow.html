<!doctype html>
<meta charset="utf-8">
<title>Ordinary float and clearance geometry</title>
<style>
  body { margin: 0 }
  section { width: 200px; height: 120px; overflow: hidden; font-size: 0; line-height: 0 }
  .left { float: left }
  .right { float: right }
  .clear-left { clear: left }
  .clear-right { clear: right }
  .clear-both { clear: both }
  .chip { display: inline-block; width: 25px; height: 10px }
  .inline { display: inline; width: 40px; height: 20px }
  .shrink { display: inline; margin: 0 auto 0 5px; padding: 0 4px; border: 1px solid }
</style>
<section id="sides">
  <span id="l" class="left inline" style="margin: 2px 5px 3px 7px"></span>
  <div id="r" class="right" style="width: 30px; height: 40px; margin-right: 8px"></div>
  <div id="adjacent" class="left" style="width: 20%; height: 10px"></div>
  <div id="ordinary" style="width: 100%; height: 3px"></div>
  <div id="onlyLeft" class="clear-left" style="height: 2px"></div>
  <div id="onlyRight" class="clear-right" style="height: 2px"></div>
</section>
<section id="rows">
  <div id="wide" class="left" style="width: 140px; height: 30px"></div>
  <div id="drop" class="right" style="width: 80px; height: 10px"></div>
  <div id="notAbove" class="left" style="width: 20px; height: 20px"></div>
  <div id="floatClear" class="right clear-both" style="width: 30px; height: 5px"></div>
</section>
<section id="auto">
  <span id="shrink" class="left shrink"><i class="chip"></i><i class="chip"></i></span>
  <span id="following" class="left inline"></span>
  <span id="hidden" class="left" style="display: none"></span>
  <span id="plain" style="display: inline"></span>
  <span id="absolute" class="right" style="position: absolute; display: inline; width: 1px"></span>
</section>
<section id="lines">
  <div class="left" style="width: 160px; height: 30px"></div>
  <div id="lineParent"><i class="chip" id="beside"></i><i class="chip" id="nextLine" style="width: 50px"></i></div>
</section>
<section id="containment">
  <div id="nonRoot"><div class="left" style="width: 10px; height: 22px"></div></div>
  <div id="outerClear" class="clear-both"></div>
  <div id="root" style="overflow: hidden"><div class="right" style="width: 10px; height: 17px"></div></div>
  <div id="afterRoot"></div>
</section>
<section id="marginCollapse">
  <div class="left" style="width: 20px; height: 30px"></div>
  <div style="height: 5px; margin-bottom: 12px"></div>
  <div id="marginClear" class="clear-left" style="height: 5px; margin-top: 15px"></div>
</section>
<section id="logical" style="direction: rtl">
  <div id="logicalFloat" style="float: inline-start; direction: ltr; width: 25px; height: 20px"></div>
  <div id="logicalClear" style="clear: inline-start; direction: ltr; height: 5px"></div>
</section>
<output id="result" data-result="not-run"></output>
<script>
  var failures = [];
  function check(name, condition) { if (!condition) failures.push(name); }
  function element(id) { return document.getElementById(id); }
  function rect(id) { return element(id).getBoundingClientRect(); }
  function relative(id, ancestor) {
    var box = rect(id), from = rect(ancestor);
    return [Math.round(box.left - from.left), Math.round(box.top - from.top),
            Math.round(box.width), Math.round(box.height)].join(",");
  }
  function style(id, property) {
    return getComputedStyle(element(id)).getPropertyValue(property);
  }
  check("blockification", style("l", "display") === "block" &&
        style("plain", "display") === "inline" && style("hidden", "display") === "none");
  check("computed-float-clear", style("l", "float") === "left" &&
        style("absolute", "float") === "none" && style("onlyRight", "clear") === "right");
  check("left-margin-box", relative("l", "sides") === "7,2,40,20");
  check("right-margin-box", relative("r", "sides") === "162,0,30,40");
  check("adjacent-percentage", relative("adjacent", "sides") === "52,0,40,10");
  check("normal-block-does-not-move", relative("ordinary", "sides") === "0,0,200,3");
  check("clear-left", relative("onlyLeft", "sides") === "0,25,200,2");
  check("clear-right", relative("onlyRight", "sides") === "0,40,200,2");
  check("drop-to-next-band", relative("drop", "rows") === "120,30,80,10");
  check("source-order-floor", relative("notAbove", "rows") === "0,30,20,20");
  check("clear-a-float", relative("floatClear", "rows") === "170,50,30,5");
  check("shrink-to-fit", Math.round(rect("shrink").width) === 60 &&
        element("shrink").offsetWidth === 60 && element("shrink").getClientRects().length === 1);
  check("shrink-auto-margin", Math.round(rect("following").left - rect("auto").left) === 65);
  check("nested-line-beside-float", relative("beside", "lines") === "160,0,25,10");
  check("nested-line-below-float", relative("nextLine", "lines") === "0,30,50,10");
  check("flow-root-containment", rect("nonRoot").height === 0 &&
        rect("outerClear").top - rect("containment").top === 22 &&
        rect("root").height === 17 && rect("afterRoot").top === rect("root").bottom);
  check("clearance-breaks-collapse", relative("marginClear", "marginCollapse") === "0,30,200,5");
  check("logical-containing-direction", style("logicalFloat", "float") === "inline-start" &&
        relative("logicalFloat", "logical") === "175,0,25,20" &&
        relative("logicalClear", "logical") === "0,20,200,5");
  element("result").setAttribute("data-result", failures.length ? failures.join(";") : "pass");
</script>
