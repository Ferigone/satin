name: OpenStreetMap public QA retest
on:
  push:
    branches: [qa/openstreetmap-alpha45-baseline]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Ensure Media Foundation is available
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:WINDIR/System32/mfplat.dll")) {
            Install-WindowsFeature Server-Media-Foundation -ErrorAction Stop
          }
      - name: Test document, form, and attribute regressions
        run: cargo test --locked -p rust-browser-engine --test forms --test attributes --test devtools_console --test document
      - name: Test layout geometry and SVG regressions
        run: cargo test --locked -p rust-browser-engine --test layout_geometry --test svg_rendering
      - name: Test worker realm and worker event loop
        run: cargo test --locked -p rust-browser-engine --lib worker
      - name: Build actual Satin
        run: cargo build --release --locked -p rust-browser
      - name: Install pinned reference driver
        run: npm install --prefix "$env:RUNNER_TEMP/osm-reference" --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 acorn@8.15.0
      - name: Capture public map retest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/osm-evidence | Out-Null
          $script = @'
          import {execFile} from 'node:child_process';
          import {promisify} from 'node:util';
          import {createRequire} from 'node:module';
          import {mkdir, mkdtemp, writeFile, rm, readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {tmpdir} from 'node:os';
          import {resolve, join} from 'node:path';
          import {performance} from 'node:perf_hooks';
          const run = promisify(execFile);
          const require = createRequire(join(process.env.RUNNER_TEMP,'osm-reference','package.json'));
          const {chromium} = require('playwright-core');
          const acorn = require('acorn');
          const satin = resolve('target/release/rust-browser.exe');
          const chrome = join(process.env.ProgramFiles,'Google','Chrome','Application','chrome.exe');
          const out = resolve('target/osm-evidence');
          const tmp = await mkdtemp(join(tmpdir(),'satin-osm-'));
          const viewport = {width:1280,height:800};
          const urls = ['https://www.openstreetmap.org/','https://www.openstreetmap.org/search?query=Warszawa'];
          const safe = x => String(x ?? '').replace(/https?:\/\/[^\s"'<>]+/g, v => {try{const u=new URL(v);return u.origin+u.pathname;}catch{return '[url]'}}).slice(0,1600);
          const report = {commit:process.env.GITHUB_SHA,sourceCommit:process.env.GITHUB_SHA,productionBase:'ad4dfb4692b9e70b87ee27cfcb99256734caf423',sha256:createHash('sha256').update(await readFile(satin)).digest('hex'),viewport,startedUtc:new Date().toISOString(),cases:[],limitations:['Chromium headless and Satin headless share the requested viewport; native smoke is a hidden-window renderer, not OS input. Native content viewport is not returned by this Satin build; review screenshot geometry before comparing.']};
          const save=async()=>{await writeFile(join(out,'summary.json'),JSON.stringify(report,null,2));console.log(JSON.stringify(report));};
          const key = value => ({action:'key',value});
          async function satinCase(url,index,phase,actions){
            const result={phase};const start=performance.now();
            const common=['--url',url,'--profile',join(tmp,'satin-'+index+'-'+phase)];
            const image=join(out,'satin-'+index+'-'+phase+'.png');
            let args;
            if(phase==='headless'){
              args=[...common,'--headless','--width','1280','--height','800','--run-for-ms','8000','--screenshot',image];
            }else{
              const file=join(tmp,index+'-'+phase+'.json');await writeFile(file,JSON.stringify(actions));
              args=[...common,'--width','1280','--height','944','--smoke-window',image,'--smoke-actions',file];
            }
            try{
              const {stdout,stderr}=await run(satin,args,{timeout:180000,maxBuffer:16*1024*1024,windowsHide:true,env:{...process.env,LOCALAPPDATA:join(tmp,'localapp')}});
              try{const j=JSON.parse(stdout.trim());result.receipt={version:j.version,url:j.url,title:j.title,frames:j.frames_presented,windowSmoke:j.window_smoke,layoutLimited:j.layout_limited,paintLimited:j.paint_limited,documentHeight:j.document_height,diagnostics:j.javascript?.diagnostics?.slice(0,40).map(safe)};}catch(e){result.parseError=safe(e.message)}
              result.stderr=safe(stderr);result.exit=0;
            }catch(e){result.error=safe(e.message);result.stderr=safe(e.stderr);result.exit=e.code;result.killed=e.killed}
            result.elapsedMs=Math.round(performance.now()-start);
            return result;
          }
          await mkdir(join(tmp,'localapp'),{recursive:true});
          let browser;
          try {
            try {browser=await chromium.launch({executablePath:chrome,headless:true});report.chromeVersion=browser.version();}catch(e){report.chromeLaunchError=safe(e.message)}
            for(const [index,url] of urls.entries()){
              const item={url,chrome:{console:[],networkErrors:[]},satin:[]};report.cases.push(item);
              if(browser){
                const ctx=await browser.newContext({viewport,deviceScaleFactor:1,locale:'en-US'});
                try{
                  const page=await ctx.newPage();
                  page.on('pageerror',e=>{if(item.chrome.console.length<40)item.chrome.console.push(safe(e.message))});
                  page.on('console',m=>{if(m.type()==='error'&&item.chrome.console.length<40)item.chrome.console.push(safe(m.text()))});
                  page.on('requestfailed',r=>{if(item.chrome.networkErrors.length<40)item.chrome.networkErrors.push({url:safe(r.url()),error:safe(r.failure()?.errorText)})});
                  page.on('response',r=>{if(r.status()>=400&&item.chrome.networkErrors.length<40)item.chrome.networkErrors.push({url:safe(r.url()),status:r.status()})});
                  const start=performance.now();
                  item.chrome.status=(await page.goto(url,{waitUntil:'domcontentloaded',timeout:25000}))?.status();
                  item.chrome.navigationMs=Math.round(performance.now()-start);
                  await page.waitForTimeout(8000);
                  const sample=()=>page.evaluate(()=>({title:document.title,url:location.href,viewport:[innerWidth,innerHeight],map:!!document.querySelector('#map'),tiles:[...document.querySelectorAll('.leaflet-tile')].filter(i=>i.complete&&i.naturalWidth>0).length,results:document.querySelectorAll('.search_results_entry').length,query:[...document.querySelectorAll('input#query')].find(i=>i.getClientRects().length>0)?.value??null}));
                  item.chrome.initial=await sample();await page.screenshot({path:join(out,'chrome-'+index+'-initial.png')});
                  item.chrome.controls=await page.evaluate(()=>[...document.querySelectorAll('#map a, #map button')].filter(e=>e.getClientRects().length&&e.getBoundingClientRect().width>0).slice(0,30).map(e=>({title:e.title,aria:e.getAttribute('aria-label'),class:e.className,tag:e.tagName,text:e.textContent.slice(0,60)})));
                  if(index===0){
                    try {
                      const src=await page.evaluate(()=>[...document.scripts].map(e=>e.src).find(v=>/^https:\/\/www\.openstreetmap\.org\/assets\/application-[a-f0-9]+\.js$/.test(v)));
                      if(!src)throw Error('Public application bundle not found');
                      const response=await page.request.get(src,{timeout:20000,maxRedirects:0});
                      if(!response.ok())throw Error('Bundle HTTP '+response.status());
                      const bytes=await response.body();
                      if(bytes.length>10*1024*1024)throw Error('Bundle exceeds capture budget');
                      const name='public-application.js';
                      await writeFile(join(out,name),bytes);
                      report.bundle={url:src,name,bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')};
                    }catch(e){report.bundleError=safe(e.message)}
                  }
                  if(index===0){
                    const input=page.locator('input#query:visible').first();
                    if(await input.isVisible()){
                      await input.click();await input.fill('Warszawa');await input.press('Enter');await page.waitForTimeout(5000);
                      item.chrome.search=await sample();await page.screenshot({path:join(out,'chrome-'+index+'-search.png')});
                    }else item.chrome.searchError='Search input not visible';
                  }else{
                    const zoom=page.locator('.leaflet-control-zoom-in:visible, [title="Zoom In"]:visible, [title="Zoom in"]:visible, [aria-label="Zoom In"]:visible, [aria-label="Zoom in"]:visible').first();
                    if(await zoom.isVisible()){
                      const box=await zoom.boundingBox();item.chrome.zoomPoint=box;
                      const t=performance.now();await zoom.click({timeout:5000});await page.waitForTimeout(1800);
                      item.chrome.zoomElapsedMs=Math.round(performance.now()-t);
                      item.chrome.zoom=await sample();await page.screenshot({path:join(out,'chrome-'+index+'-zoom.png')});
                    }else item.chrome.zoomError='Zoom control not visible';
                  }
                }catch(e){item.chrome.error=safe(e.message)}finally{await ctx.close()}
              }
              item.satin.push(await satinCase(url,index,'headless',[]));await save();
              item.satin.push(await satinCase(url,index,'native-initial',[]));await save();
              if(index===0){
                item.satin.push(await satinCase(url,index,'native-search',[{action:'click_at',x:70,y:203},{action:'text',value:'Warszawa'},key('Enter')]));await save();
              }else if(item.chrome.zoomPoint){
                const {x,y,width,height}=item.chrome.zoomPoint;
                // Previous native screenshot has a 121 px top chrome and 23 px footer.
                // This is an exploratory click; verify the target in Satin's screenshot.
                item.satinZoomAttempt={x:x+width/2,y:y+height/2+121};
                item.satin.push(await satinCase(url,index,'native-zoom',[{action:'click_at',...item.satinZoomAttempt}]));await save();
              }
            }
            if(report.bundle){
              try {
                const source=await readFile(join(out,report.bundle.name),'utf8');
                const diagnostics=report.cases.flatMap(c=>c.satin.flatMap(s=>s.receipt?.diagnostics??[]));
                const diagnostic=diagnostics.find(s=>s.includes(report.bundle.url)&&s.includes('nesting limit exceeded'));
                const loc=diagnostic?.match(/\((\d+):(\d+)\)/);
                if(loc){
                  const line=Number(loc[1]), column=Number(loc[2]);
                  const lines=source.split('\n');
                  const offset=lines.slice(0,line-1).reduce((n,l)=>n+l.length+1,0)+column-1;
                  let root;
                  try{root=acorn.parse(source,{ecmaVersion:'latest',sourceType:'script',locations:true});}
                  catch{root=acorn.parse(source,{ecmaVersion:'latest',sourceType:'module',locations:true});}
                  const ancestry=[];
                  for(let node=root;node;){
                    ancestry.push({type:node.type,start:node.loc.start,end:node.loc.end});
                    const children=Object.values(node).flatMap(v=>Array.isArray(v)?v:[v]).filter(v=>v&&typeof v.type==='string'&&v.start<=offset&&offset<v.end);
                    node=children.sort((a,b)=>(a.end-a.start)-(b.end-b.start))[0];
                  }
                  report.bundle.parserSite={line,column,offset,excerpt:lines[line-1]?.slice(Math.max(0,column-401),column+400),ancestry};
                }else report.bundle.parserSiteError='No matching nesting diagnostic for captured bundle';
              }catch(e){report.bundle.parserSiteError=safe(e.message)}
              await save();
            }
          } finally {if(browser)await browser.close();await save();await rm(tmp,{recursive:true,force:true,maxRetries:3}).catch(()=>{});}
          '@
          $scriptPath = Join-Path $env:RUNNER_TEMP 'osm-qa.mjs'
          $script | Set-Content -LiteralPath $scriptPath -Encoding utf8
          node $scriptPath
          if ($LASTEXITCODE -ne 0) { throw 'QA runner failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: openstreetmap-alpha47-retest
          path: target/osm-evidence/
          if-no-files-found: warn

  public-release-hashes:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Independently download and hash the published Windows packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versions = @('v0.1.0-alpha.46', 'v0.1.0-alpha.47')
          $records = foreach ($version in $versions) {
            $meta = Invoke-RestMethod "https://api.github.com/repos/Ferigone/satin/releases/tags/$version"
            if ($meta.draft) { throw "Release is draft: $version" }
            $assets = @($meta.assets | Where-Object { $_.name -match '\.(exe|zip)$' })
            if ($assets.Count -ne 2) { throw "Missing release packages: $version" }
            foreach ($asset in $assets) {
              $path = Join-Path $env:RUNNER_TEMP "$version-$($asset.name)"
              try {
                Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $path
                $digest = 'sha256:' + (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
                [pscustomobject]@{version=$version;name=$asset.name;sha256=$digest;expected=$asset.digest;match=($digest -ceq $asset.digest);bytes=(Get-Item -LiteralPath $path).Length;expectedBytes=$asset.size}
              } finally { Remove-Item -LiteralPath $path -ErrorAction SilentlyContinue }
            }
          }
          New-Item -ItemType Directory -Force target/release-hash-evidence | Out-Null
          $records | ConvertTo-Json | Set-Content target/release-hash-evidence/hashes.json
          Get-Content target/release-hash-evidence/hashes.json
          if (@($records | Where-Object { -not $_.match -or $_.bytes -ne $_.expectedBytes }).Count -ne 0 -or @($records).Count -ne 4) { throw 'Release digest mismatch or incomplete assets' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alpha46-alpha47-public-package-hashes
          path: target/release-hash-evidence/
          if-no-files-found: warn
