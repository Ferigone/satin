[package]
name = "rust-browser-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
twitch-bootstrap-profile = ["rust-browser-javascript/twitch-bootstrap-profile"]
media-startup-diagnostics = ["rust-browser-javascript/media-startup-diagnostics"]

[[test]]
name = "twitch_bootstrap_profile"
required-features = ["twitch-bootstrap-profile"]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
rust-browser-javascript = { path = "../javascript" }
url = "2.5"
encoding_rs = "0.8"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "http2", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.30", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
hyper = { version = "1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
fontdb = "0.23"
ab_glyph = "0.2"
wuff = { version = "=0.2.10", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli = "9.1"
unicode-segmentation = "1"
rustybuzz = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ring = "0.17"
base64 = "0.22"
roxmltree = "0.20"

[target.'cfg(windows)'.dependencies]
rust-browser-media-foundation = { path = "../media-foundation" }

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

