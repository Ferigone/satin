<section id="home-add-panel" class="home-panel home-add-panel" hidden>
  <h2>Add a shortcut</h2>
  <form id="home-add-form">
    <div class="home-add-fields">
      <input id="home-shortcut-name" aria-label="Name" placeholder="Name" maxlength="48">
      <input id="home-shortcut-url" aria-label="Web address" placeholder="Web address" maxlength="2048" required>
    </div>
    <div class="home-panel-actions">
      <button id="home-shortcut-save" type="submit">Save</button>
      <button id="home-shortcut-cancel" type="button">Cancel</button>
    </div>
    <p id="home-add-error" class="home-add-error" aria-live="polite" hidden></p>
  </form>
</section>
<script>
  function show(element, visible) {
    if (visible) element.removeAttribute("hidden");
    else element.setAttribute("hidden", "");
  }

  function webAddress(text) {
    const explicit = /^https?:\/\//i.test(text);
    const domain = /^[a-z0-9-]+(?:\.[a-z0-9-]+)+(?::[0-9]+)?(?:[\/?#]\S*)?$/i.test(text);
    if (!explicit && !domain) return null;
    try {
      return new URL(explicit ? text : "https://" + text);
    } catch (error) {
      return null;
    }
  }

  const query = document.getElementById("home-query");
  const hint = document.getElementById("home-query-hint");
  query.addEventListener("input", () => show(hint, query.value.length === 0));
  document.getElementById("home-search-form").addEventListener("submit", event => {
    const text = query.value.trim();
    if (!text) {
      event.preventDefault();
      return;
    }
    const address = webAddress(text);
    if (address) {
      event.preventDefault();
      location.assign(address.href);
    }
  });

  const demosButton = document.getElementById("home-demos-toggle");
  const demosPanel = document.getElementById("home-demos");
  const addButton = document.getElementById("home-add-toggle");
  const addPanel = document.getElementById("home-add-panel");
  const titleField = document.getElementById("home-shortcut-name");
  const addressField = document.getElementById("home-shortcut-url");
  const errorText = document.getElementById("home-add-error");
  const customSites = document.getElementById("home-custom-sites");
  const storageKey = "satin.home.shortcuts";
  const maxShortcuts = 5;

  function openPanel(button, panel, open) {
    button.setAttribute("aria-expanded", open ? "true" : "false");
    show(panel, open);
  }

  function displayError(message) {
    errorText.textContent = message;
    show(errorText, message.length > 0);
  }

  function savedShortcuts() {
    try {
      const items = JSON.parse(localStorage.getItem(storageKey) || "[]");
      if (!Array.isArray(items)) return [];
      const valid = [];
      for (const item of items) {
        if (valid.length === maxShortcuts) break;
        if (!item || typeof item.url !== "string" || typeof item.name !== "string") continue;
        if (!item.name || item.name.length > 48 || item.url.length > 2048) continue;
        const address = webAddress(item.url);
        if (address) valid.push({ name: item.name, url: address.href });
      }
      return valid;
    } catch (error) {
      return [];
    }
  }

  function renderShortcuts(shortcuts) {
    customSites.replaceChildren();
    for (let index = 0; index < shortcuts.length; index++) {
      const shortcut = shortcuts[index];
      const link = document.createElement("a");
      link.setAttribute("id", "home-custom-" + index);
      link.setAttribute("class", "home-custom-site");
      link.setAttribute("href", shortcut.url);
      link.textContent = shortcut.name;
      customSites.appendChild(link);
    }
    show(customSites, shortcuts.length > 0);
  }

  addButton.addEventListener("click", () => {
    const open = addButton.getAttribute("aria-expanded") !== "true";
    openPanel(demosButton, demosPanel, false);
    openPanel(addButton, addPanel, open);
    if (open) {
      displayError("");
      titleField.focus();
    }
  });

  demosButton.addEventListener("click", () => {
    const open = demosButton.getAttribute("aria-expanded") !== "true";
    openPanel(addButton, addPanel, false);
    openPanel(demosButton, demosPanel, open);
  });

  document.getElementById("home-shortcut-cancel").addEventListener("click", () => {
    openPanel(addButton, addPanel, false);
    addButton.focus();
  });

  document.getElementById("home-add-form").addEventListener("submit", event => {
    event.preventDefault();
    const address = webAddress(addressField.value.trim());
    if (!address) {
      displayError("Enter an HTTP or HTTPS address.");
      return;
    }

    const shortcuts = savedShortcuts();
    if (shortcuts.some(shortcut => shortcut.url === address.href)) {
      displayError("This address is already saved.");
      return;
    }
    if (shortcuts.length === maxShortcuts) {
      displayError("You can save up to five shortcuts.");
      return;
    }

    const name = (titleField.value.trim() || address.hostname).slice(0, 48);
    shortcuts.push({ name, url: address.href });
    try {
      localStorage.setItem(storageKey, JSON.stringify(shortcuts));
    } catch (error) {
      displayError("This shortcut could not be saved.");
      return;
    }

    renderShortcuts(shortcuts);
    titleField.value = "";
    addressField.value = "";
    displayError("");
    openPanel(addButton, addPanel, false);
    addButton.focus();
  });

  window.addEventListener("storage", event => {
    if (event.key === storageKey) renderShortcuts(savedShortcuts());
  });
  renderShortcuts(savedShortcuts());
</script>
