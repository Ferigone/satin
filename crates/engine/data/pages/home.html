<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Nowa karta</title>
  <style>
    body {
      margin: 0;
      background: #19191c;
      color: #f0edf0;
      font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
    }
    main {
      box-sizing: border-box;
      height: 100vh;
      min-height: 216px;
      padding: 27px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .home-inner {
      position: relative;
      /* The reference uses window vh; this document's vh excludes browser chrome. */
      top: calc(-3vh - 3.5px);
      width: 100%;
      max-width: 486px;
    }
    .home-wordmark {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      margin: 0 0 27px;
      font-family: Georgia, serif;
      font-size: 6.6vw;
      font-weight: 400;
      line-height: 1;
    }
    .home-mark {
      display: block;
      flex: none;
      width: .54em;
      height: .54em;
    }
    .home-brand-text {
      display: flex;
      flex: none;
      position: relative;
      /* Align the painted Georgia baseline without shifting the mark or field. */
      top: -.02em;
    }
    .home-brand-text > span {
      display: block;
      flex: none;
      /* Keep the Georgia glyph widths; emulate the reference's -.085em tracking. */
      margin-right: -.085em;
    }
    .home-search {
      display: flex;
      align-items: center;
      gap: 10px;
      box-sizing: border-box;
      width: 100%;
      min-height: 47px;
      padding: 7px 12px;
      background: transparent;
      border: 1px solid #3e3a42;
      border-radius: 7px;
      color: #b8afb5;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.4;
      text-align: left;
    }
    .home-search:focus {
      background: #252429;
      border-color: #c4a3f4;
      outline: 2px solid #c4a3f4;
      outline-offset: 2px;
    }
    .home-search-icon {
      display: block;
      flex: none;
      width: 17px;
      height: 17px;
    }
    .home-search-label {
      flex: 1;
      min-width: 0;
    }
    .home-shortcut {
      flex: none;
      padding: 2px 5px;
      background: #19191c;
      border: 1px solid #3e3a42;
      border-radius: 4px;
      font-family: inherit;
      font-size: 10px;
      line-height: 1.4;
      white-space: nowrap;
    }
    @media (min-width: 1394px) {
      .home-wordmark { font-size: 92px; }
    }
    @media (max-width: 788px) {
      .home-wordmark { font-size: 52px; }
    }
    @media (max-width: 660px) {
      .home-inner { top: 0; }
      .home-wordmark { margin-bottom: 20px; }
    }
    @media (max-width: 300px) {
      .home-shortcut { display: none; }
    }
    @media (max-width: 220px) {
      .home-wordmark { gap: 8px; font-size: 44px; }
      .home-search { padding: 7px 8px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="home-inner">
      <h1 class="home-wordmark" aria-label="Satin"><svg class="home-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 17.5 11.5 4h5L9 17.5z" fill="#c4a3f4"/>
        <path d="m10.5 20 7.4-13.5H21L13.6 20z" fill="#c4a3f4" opacity=".49"/>
      </svg><span class="home-brand-text"><span>S</span><span>a</span><span>t</span><span>i</span><span>n</span></span></h1>
      <button id="home-search" class="home-search" type="button" aria-keyshortcuts="Control+L">
        <svg class="home-search-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none"
             stroke="#c4a3f4" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10.5" cy="10.5" r="5.5"/>
          <path d="m15 15 5 5"/>
        </svg>
        <span class="home-search-label">Wyszukaj lub wpisz adres</span>
        <kbd class="home-shortcut" aria-hidden="true">Ctrl L</kbd>
      </button>
    </div>
  </main>
  <script>
    document.getElementById("home-search").addEventListener("click", function () {
      location.assign("about:home?focus=address");
    });
  </script>
</body>
</html>
