<!doctype html>
<meta charset="utf-8">
<title>Logical properties in a channel toolbar</title>
<style>
    :root { font-size: 10px; }
    body { margin: 0; }
    #panel {
        position: relative;
        inline-size: 320px;
        block-size: 120px;
        background-color: #18181b;
    }
    #toolbar {
        display: flex;
        align-items: center;
        block-size: 40px;
    }
    #avatar {
        inline-size: 24px;
        block-size: 24px;
        margin-inline-start: 16px;
        margin-inline-end: 1.4rem;
        background-color: #9147ff;
    }
    #follow {
        width: 80px;
        inline-size: 48px;
        min-inline-size: 60px;
        max-inline-size: 76px;
        block-size: 18px;
        padding-inline: 5px 7px;
        padding-block: 3px;
        background-color: #bf94ff;
    }
    #dismiss {
        --control-gutter: calc(5px + .7rem);
        position: absolute;
        inline-size: 20px;
        block-size: 20px;
        inset-inline-end: var(--control-gutter);
        inset-block-start: 8px;
        background-color: #efeff1;
    }
</style>
<div id="panel">
    <div id="toolbar"><div id="avatar"></div><div id="follow"></div></div>
    <div id="dismiss"></div>
</div>
<pre id="result"></pre>
<script>
    function logicalSnapshot() {
        const panel = document.getElementById('panel');
        const avatar = document.getElementById('avatar');
        const follow = document.getElementById('follow');
        const dismiss = document.getElementById('dismiss');
        function rect(element) {
            const r = element.getBoundingClientRect();
            return [r.x, r.y, r.width, r.height];
        }
        const first = [rect(panel), rect(avatar), rect(follow), rect(dismiss)];
        const avatarStyle = getComputedStyle(avatar);
        const followStyle = getComputedStyle(follow);
        const dismissStyle = getComputedStyle(dismiss);
        const computed = [avatarStyle.marginInline, followStyle.inlineSize,
            followStyle.getPropertyValue('padding-inline'), followStyle.paddingBlock,
            dismissStyle.insetInlineEnd, dismissStyle.right];
        dismiss.style.direction = 'rtl';
        follow.style.setProperty('padding-inline-start', '9px');
        avatar.style.marginInline = '8px 14px';
        const updated = [rect(avatar), rect(follow), rect(dismiss)];
        const live = [avatarStyle.marginInlineStart, followStyle.paddingInline,
            dismissStyle.direction, dismissStyle.left, dismissStyle.insetInlineEnd];
        return { first, computed, updated, live };
    }
    document.getElementById('result').textContent = JSON.stringify(logicalSnapshot());
</script>
