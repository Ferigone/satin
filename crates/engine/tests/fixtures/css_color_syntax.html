<!doctype html>
<meta charset="utf-8">
<title>Legacy and modern CSS color separators</title>
<style>
  html, body { margin: 0; background-color: white; }
  div { width: 16px; height: 16px; }
</style>
<div style="background-color:lime; background-color:rgb(255, 0 0)"></div>
<div style="background-color:lime; background-color:rgba(255,,0,0)"></div>
<div style="background-color:lime; background-color:rgb(255 0 0 1)"></div>
<div style="background-color:lime; background-color:rgb(255 0 0 /)"></div>
<div style="background-color:lime; background-color:rgba(255, 0, 0 / 1)"></div>
<div style="background-color:lime; background-color:rgb(255, 0%, 0%)"></div>
<div style="background-color:lime; background-color:hsl(0 100%, 50%)"></div>
<div style="background-color:lime; background-color:hsla(0 100% 50% // 1)"></div>
<div style="background-color:lime; background-color:rgb(255, 0, 0,)"></div>
<div style="background-color:lime; background-color:RGB(100%, 0%, 0%, 1)"></div>
<div style="background-color:lime; background-color:rgba(255 0% 0/80%)"></div>
<div style="background-color:lime; background-color:hsl(0turn, 100%, 50%, 80%)"></div>
<div style="background-color:lime; background-color:hsla(360deg 100% 50%)"></div>
