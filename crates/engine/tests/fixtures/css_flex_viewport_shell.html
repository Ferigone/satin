<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Viewport-sized Flexbox shell</title>
<style>
    html, body, #shell {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
    }
    #shell { --bar-height: 50px; background: #18181b; }
    #bar {
        position: absolute;
        inset-block-start: 0;
        width: 100%;
        height: var(--bar-height);
        background: #252529;
    }
    #loader {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding-block-start: var(--bar-height);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #indicator {
        width: 22px;
        height: 22px;
        background: #a991d4;
    }
</style>
<body>
<div id="shell">
    <div id="bar"></div>
    <div id="loader"><div id="indicator"></div></div>
</div>
<pre id="measurements" hidden></pre>
<script>
    function shellMeasurements() {
        const result = {};
        for (const selector of ['html', 'body', '#shell', '#bar', '#loader', '#indicator']) {
            const r = document.querySelector(selector).getBoundingClientRect();
            result[selector] = [r.x, r.y, r.width, r.height];
        }
        return result;
    }
    document.getElementById('measurements').textContent = JSON.stringify(shellMeasurements());
</script>
