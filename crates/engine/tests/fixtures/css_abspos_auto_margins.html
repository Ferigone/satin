<!doctype html>
<title>Absolute positioning with negative auto-margin space</title>
<style>
  body { margin: 40px; background: white }
  .cb { position: relative; width: 100px; height: 60px }
  .cb + .cb { margin-top: 30px }
  #block {
    position: absolute;
    inset: 10px auto 10px 10px;
    width: 20px;
    height: 80px;
    margin: auto 0;
    background: red;
  }
  #inline {
    position: absolute;
    inset: 30px 10px auto;
    width: 120px;
    height: 10px;
    margin: 0 auto;
    background: blue;
  }
</style>
<div class="cb"><div id="block"></div></div>
<div class="cb"><div id="inline"></div></div>
