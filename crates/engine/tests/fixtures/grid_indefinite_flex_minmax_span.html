<!doctype html>
<style>
  body { margin: 0; font-size: 0; line-height: 0 }
  .grid { display: grid; width: 160px; grid-template-columns: 160px }
  .span { grid-column: 1; height: 200px }
</style>
<div class="grid" id="one-freeze" style="grid-template-rows:minmax(100px,.25fr) minmax(0px,.25fr)">
  <div class="span" style="grid-row:1 / span 2"></div>
  <div id="one-first" style="grid-row:1; grid-column:1"></div>
  <div id="one-last" style="grid-row:2; grid-column:1"></div>
</div>
<div class="grid" id="two-freezes" style="grid-template-rows:minmax(100px,.25fr) minmax(40px,.25fr) minmax(0px,.25fr)">
  <div class="span" style="grid-row:1 / span 3"></div>
  <div id="two-middle" style="grid-row:2; grid-column:1"></div>
  <div id="two-last" style="grid-row:3; grid-column:1"></div>
</div>
<div class="grid" id="no-freeze" style="grid-template-rows:minmax(10px,.25fr) minmax(0px,.25fr)">
  <div class="span" style="grid-row:1 / span 2"></div>
  <div id="no-last" style="grid-row:2; grid-column:1"></div>
</div>
