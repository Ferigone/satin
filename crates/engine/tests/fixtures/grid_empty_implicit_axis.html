<!doctype html>
<style>body { margin: 0; font-size: 0; line-height: 0 }</style>
<div id="empty-rows" style="display:grid; width:180px; grid-template-columns:60px 60px;
                            grid-auto-rows:40px; row-gap:7px"></div>
<div id="explicit-row" style="display:grid; width:180px; grid-template-rows:25px;
                              grid-auto-rows:40px; row-gap:7px"></div>
<div id="occupied-row" style="display:grid; width:180px; grid-auto-rows:40px; row-gap:7px">
  <div id="item"></div>
</div>
