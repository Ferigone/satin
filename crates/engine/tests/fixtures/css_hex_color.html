<!doctype html>
<meta charset="utf-8">
<title>Hex color digits, not signed integers</title>
<style>
  html, body { margin: 0; background-color: white; }
  div { width: 16px; height: 16px; }
  #signed-short { background-color: lime; background-color: #+f0000; }
  #signed-long { background-color: lime; background-color: #+f0000ff; }
</style>
<div id="signed-short"></div>
<div id="signed-long"></div>
<div style="background-color:#F00"></div>
<div style="background-color:#F008"></div>
<div style="background-color:#0F0000"></div>
<div style="background-color:#FF0000CC"></div>
