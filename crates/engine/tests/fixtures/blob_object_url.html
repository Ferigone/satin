<!doctype html>
<meta charset="utf-8">
<pre id="result">pending</pre>
<script>
(async function () {
    // A preview and download share a sliced snapshot of the edited file bytes.
    const source = new Uint8Array([88, 97, 98, 99, 89]);
    const file = new Blob([source]).slice(1, 4, "text/plain");
    source[2] = 120;
    const preview = URL.createObjectURL(file);
    const download = URL.createObjectURL(file);
    const origin = new URL(preview).origin;

    // Revoke after starting the fetch, but before receiving its response.
    const previewFetch = fetch(preview + "#preview");
    URL.revokeObjectURL(preview);
    let fresh;
    try {
        await fetch(preview);
        fresh = "unexpected success";
    } catch (error) {
        fresh = error.name;
    }
    const previewResponse = await previewFetch;
    const previewBytes = new Uint8Array(await previewResponse.arrayBuffer());
    const snapshot = Array.from(previewBytes);
    previewBytes[0] = 0;

    // Revoking one URL does not revoke another registration for the same Blob.
    const downloadResponse = await fetch(download);
    URL.revokeObjectURL(download);
    const result = {
        origin,
        serialized: preview.startsWith("blob:" + origin + "/"),
        distinct: preview !== download,
        fresh,
        preview: [previewResponse.url === preview, previewResponse.type, previewResponse.status,
            previewResponse.headers.get("content-type"), snapshot],
        download: await downloadResponse.text(),
        direct: await file.text(),
    };
    document.getElementById("result").textContent = JSON.stringify(result);
})().catch(function (error) {
    document.getElementById("result").textContent = String(error);
});
</script>
