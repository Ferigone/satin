[package]
name = "rust-browser-javascript"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "rust_browser_javascript"
path = "src/lib.rs"

[features]
twitch-bootstrap-profile = []
media-startup-diagnostics = ["windows-sys/Win32_System_WindowsProgramming"]
compiler-qa = []

[[example]]
name = "profile_compiler"
required-features = ["compiler-qa"]

[[example]]
name = "profile_work"
required-features = ["media-startup-diagnostics"]

[dependencies]
icu_normalizer = "=2.4.0"
regex-automata = { version = "=0.4.13", default-features = false, features = ["std", "syntax", "dfa-build", "dfa-search"] }
num-bigint = "=0.4.6"
num-rational = "=0.4.2"
num-traits = "0.2.19"
icu_locale = "=2.4.0"
icu_calendar = "=2.4.0"
icu_datetime = "=2.4.0"
icu_time = "=2.4.0"
icu_decimal = "=2.4.0"
base64 = "=0.22.1"
miniz_oxide = "=0.8.9"
icu_casemap = "=2.4.0"
icu_experimental = "=0.7.0"
writeable = "0.6.4"
fixed_decimal = { version = "=0.7.3", features = ["ryu"] }
jiff = "0.2"
icu_collator = "=2.4.0"
icu_list = "=2.4.0"
icu_plurals = "=2.4.0"
unicode-segmentation = "=1.13.3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_System_Time"] }
