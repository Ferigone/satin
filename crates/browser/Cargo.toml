[package]
name = "rust-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
media-startup-diagnostics = ["rust-browser-engine/media-startup-diagnostics"]
v8-engine = ["rust-browser-engine/v8-engine"]
stylo-engine = ["rust-browser-engine/stylo-engine"]
vello-renderer = ["rust-browser-engine/vello-renderer"]
gstreamer-media = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[dependencies]
rust-browser-engine = { path = "../engine" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "fs", "io-util"] }
winit = "0.30"
softbuffer = "0.4"
arboard = { version = "3", default-features = false }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
ring = "0.17"
semver = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
gstreamer = { version = "=0.25.4", optional = true, features = ["v1_28"] }
gstreamer-app = { version = "=0.25.2", optional = true, features = ["v1_28"] }
gstreamer-video = { version = "=0.25.4", optional = true, features = ["v1_28"] }
windows = { version = "=0.62.2", features = ["Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell"] }
windows-core = "=0.62.2"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_Storage_FileSystem"] }

