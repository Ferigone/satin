[package]
name = "rust-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
rust-browser-engine = { path = "../engine" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
winit = "0.30"
softbuffer = "0.4"
arboard = { version = "3", default-features = false }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_UI_Controls_Dialogs"] }

